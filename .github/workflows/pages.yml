name: Pages

# Builds the app and publishes it to GitHub Pages.
# Runs after each release (called from release.yml) or by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment halfway; a newer one waits for the current one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npx -y npm@11 ci

      # The SoundFont (MIT, 40 MB) is not in git: reuse a cached copy, download only when missing.
      - name: Restore SoundFont
        uses: actions/cache@v4
        with:
          path: public/soundfonts/MuseScore_General.sf3
          key: soundfont-${{ hashFiles('scripts/fetch-soundfont.sh') }}

      - name: Download SoundFont
        run: test -f public/soundfonts/MuseScore_General.sf3 || npm run soundfont

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Pages serves the site from /<repo>/ (base_path has no trailing slash).
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # Pages has no SPA routing: serve the app for unknown paths, so reloading /train or /lab works.
      - name: Fallback page for app routes
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
