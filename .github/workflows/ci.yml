name: CI

# Checks every push and pull request; the release workflow reuses it before publishing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm 10 crashes on this lockfile (arborist peer-set bug), npm 11 does not.
      - name: Install dependencies
        run: npx -y npm@11 ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test
